<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lignomat Sensors — Download</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f5;
      color: #1a1a1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 48px 16px;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.10);
      padding: 40px 48px;
      max-width: 540px;
      width: 100%;
      text-align: center;
    }
    h1 { font-size: 1.6rem; margin-bottom: 8px; }
    .subtitle { color: #555; font-size: 0.95rem; margin-bottom: 32px; }
    .btn {
      display: inline-block;
      background: #1565C0;
      color: #fff;
      text-decoration: none;
      padding: 14px 36px;
      border-radius: 8px;
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 16px;
      transition: background 0.15s;
    }
    .btn:hover { background: #0D47A1; }
    .btn:active { background: #0A3880; }
    .version-info { color: #777; font-size: 0.88rem; margin-top: 10px; }
    .requirements {
      margin-top: 28px;
      font-size: 0.85rem;
      color: #666;
      border-top: 1px solid #eee;
      padding-top: 20px;
    }
    .loading { color: #999; font-size: 0.95rem; }
    .error { color: #c62828; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Lignomat Sensors</h1>
    <p class="subtitle">Moisture Content and Temperature monitoring — Windows installer</p>

    <div id="download-area">
      <p class="loading">Loading latest release…</p>
    </div>

    <div class="requirements">
      <strong>Requirements:</strong> Windows 10 or 11, 64-bit<br>
      Run installer as Administrator. BL2 USB driver is included and installed automatically.
    </div>
  </div>

  <script>
    // ── Config ─────────────────────────────────────────────────────────────
    // Update REPO to match your public releases repo (owner/name)
    const REPO = "mdpdx/lignomat-sensors-releases";
    // ───────────────────────────────────────────────────────────────────────

    const area = document.getElementById("download-area");

    async function loadLatestRelease() {
      try {
        const res = await fetch(
          `https://api.github.com/repos/${REPO}/releases/latest`,
          { headers: { Accept: "application/vnd.github+json" } }
        );
        if (!res.ok) throw new Error(`GitHub API ${res.status}`);
        const rel = await res.json();

        // Find the .exe asset
        const asset = rel.assets.find(a => a.name.endsWith(".exe"));
        if (!asset) throw new Error("No .exe found in release assets");

        const version = rel.tag_name.replace(/^v/, "");
        const date = new Date(rel.published_at).toLocaleDateString("en-US", {
          year: "numeric", month: "long", day: "numeric"
        });

        area.innerHTML = `
          <a class="btn" href="${asset.browser_download_url}" download>
            ⬇ Download  v${version}
          </a>
          <p class="version-info">
            Released ${date} &nbsp;·&nbsp; ${(asset.size / 1024 / 1024).toFixed(1)} MB
          </p>`;
      } catch (err) {
        area.innerHTML = `
          <p class="error">Could not load release information.<br>
          <a href="https://github.com/${REPO}/releases/latest">Go to releases page</a></p>`;
        console.error(err);
      }
    }

    loadLatestRelease();
  </script>
</body>
</html>
